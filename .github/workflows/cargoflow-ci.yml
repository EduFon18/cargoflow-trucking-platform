name: CargoFlow CI Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall backend

      - name: Run FastAPI smoke test
        working-directory: backend
        run: |
          python -c "from main import app; assert app is not None; assert len(app.routes) > 0; print('FastAPI application loaded successfully. Routes:', len(app.routes))"


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build CargoFlow API Docker image
        run: |
          docker build -t cargoflow-api-ci ./backend

      - name: Verify Docker image
        run: |
          docker image inspect cargoflow-api-ci
          echo "CargoFlow Docker image built successfully."


  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-build
      - docker-build

    steps:
      - name: Confirm CI pipeline
        run: |
          echo "CargoFlow CI pipeline completed successfully."
          echo "Backend validation: PASSED"
          echo "Frontend build: PASSED"
          echo "Docker build: PASSED"