name: CargoFlow Automated Business Analysis

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  run-cargoflow-analysis:
    name: Run CargoFlow Automated Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # -----------------------------------------------
      # 1. Download repository
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------
      # 2. Configure Python
      # -----------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # -----------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # -----------------------------------------------
      # 4. Validate input dataset
      # -----------------------------------------------
      - name: Validate CargoFlow dataset
        run: |
          test -f data/cleaned/cargoflow_trucking_moves_cleaned.csv
          echo "CargoFlow cleaned dataset found successfully."

      # -----------------------------------------------
      # 5. Run automated business analysis
      # -----------------------------------------------
      - name: Run CargoFlow business analysis
        run: |
          mkdir -p automation_output
          python analysis/cargoflow_business_analysis.py | tee automation_output/business-analysis-results.txt

      # -----------------------------------------------
      # 6. Upload successful result
      # -----------------------------------------------
      - name: Upload analysis results
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cargoflow-business-analysis-results
          path: |
            automation_output/business-analysis-results.txt
            data/cleaned/cargoflow_trucking_moves_cleaned.csv
          if-no-files-found: error

      # -----------------------------------------------
      # 7. Failure handling
      # -----------------------------------------------
      - name: Create failure report
        if: failure()
        run: |
          mkdir -p automation_logs
          echo "CargoFlow automated analysis failed." > automation_logs/automation-failure.txt
          echo "Check GitHub Actions logs for the failed step." >> automation_logs/automation-failure.txt
          echo "Run ID: $GITHUB_RUN_ID" >> automation_logs/automation-failure.txt
          echo "Repository: $GITHUB_REPOSITORY" >> automation_logs/automation-failure.txt

      # -----------------------------------------------
      # 8. Upload failure evidence
      # -----------------------------------------------
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cargoflow-automation-failure-report
          path: automation_logs/automation-failure.txt