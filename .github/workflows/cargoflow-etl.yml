name: CargoFlow Automated ETL Workflow

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  run-cargoflow-etl:
    name: Run CargoFlow ETL Pipeline
    runs-on: ubuntu-latest

    env:
      DB_SERVER: ${{ secrets.DB_SERVER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # ---------------------------------------------------
      # 1. Download repository code
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------
      # 2. Configure Python
      # ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------
      # 3. Install Microsoft ODBC Driver 18
      # ---------------------------------------------------
      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb

          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      # ---------------------------------------------------
      # 4. Install Python dependencies
      # ---------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyodbc python-dotenv

      # ---------------------------------------------------
      # 5. Validate required secrets
      # ---------------------------------------------------
      - name: Validate database configuration
        run: |
          python -c "
          import os

          required = [
              'DB_SERVER',
              'DB_NAME',
              'DB_USER',
              'DB_PASSWORD'
          ]

          missing = [
              name
              for name in required
              if not os.getenv(name)
          ]

          if missing:
              raise RuntimeError(
                  'Missing required GitHub Secrets: '
                  + ', '.join(missing)
              )

          print('Database configuration validated successfully.')
          "

      # ---------------------------------------------------
      # 6. Run CargoFlow ETL
      # ---------------------------------------------------
      - name: Run CargoFlow ETL pipeline
        run: |
          python etl/cargoflow_etl.py

      # ---------------------------------------------------
      # 7. Upload successful ETL output
      # ---------------------------------------------------
      - name: Upload ETL output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cargoflow-etl-output
          path: |
            data/raw/cargoflow_trucking_moves_raw.csv
            data/cleaned/cargoflow_trucking_moves_cleaned.csv
          if-no-files-found: error

      # ---------------------------------------------------
      # 8. Failure handling
      # ---------------------------------------------------
      - name: Create failure report
        if: failure()
        run: |
          mkdir -p automation_logs

          echo "CargoFlow ETL workflow failed." > automation_logs/etl-failure.txt
          echo "Check the GitHub Actions execution logs for the failed step." >> automation_logs/etl-failure.txt
          echo "Run ID: $GITHUB_RUN_ID" >> automation_logs/etl-failure.txt
          echo "Repository: $GITHUB_REPOSITORY" >> automation_logs/etl-failure.txt

      # ---------------------------------------------------
      # 9. Upload failure evidence
      # ---------------------------------------------------
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargoflow-etl-failure-report
          path: automation_logs/etl-failure.txt